name: Generate Activity Graph

on:
  schedule:
    - cron: "0 */12 * * *" # Otomatis update tiap 12 jam
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: NBFiidly
          options: theme=react-dark&hide_border=true
          output_path: dist/activity-graph.svg

      - name: Push Activity Graph SVG
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
